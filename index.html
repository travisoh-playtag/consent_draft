:root{
  /* Layout idea: a letter home from the school. The school's own color and name carry the page;
     a left rail holds the school identity and the five steps, one reading column sits beside it.
     Playtag ink and mint appear only in the internal draft bar, never on the family page. */
  --paper:#F5F7F5;
  --surface:#FFFFFF;
  --ink:#0A0A0A;
  --muted:#55605A;
  --line:#D8DFDA;
  --school:#3A4FA3;
  --on-school:#FFFFFF;
  --school-tint:#EEF0F8;
  --mark:#FFE873;
  --ok:#1A7A4A;
  --warn:#9A5B00;
  --no:#3B4540;
  --err:#B3261E;
  --pt-teal:#0F8F75;
  --pt-mint:#30E9BD;
  --font:"Pretendard Std","Pretendard",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --r-sm:6px; --r-md:12px;
  color-scheme:light;
}
*{box-sizing:border-box}
html{height:100%;-webkit-text-size-adjust:100%}
body{margin:0;min-height:100%;background:var(--paper);color:var(--ink);font-family:var(--font);font-size:17px;line-height:1.55;font-feature-settings:"kern","liga"}
h1,h2,h3{text-wrap:balance;margin:0;letter-spacing:-0.015em}
p{margin:0}
a{color:var(--school);text-underline-offset:3px}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--ink);outline-offset:2px;border-radius:4px}
[hidden]{display:none !important}

/* ---------- internal draft bar (Playtag chrome) ---------- */
.draftbar{position:sticky;top:0;z-index:20;background:var(--ink);color:#fff;display:flex;flex-wrap:wrap;align-items:center;gap:6px 18px;padding:8px 16px;font-size:14px}
.draftbar-label{font-weight:700;color:var(--pt-mint);white-space:nowrap}
.draftbar-tabs{display:flex;gap:4px;overflow-x:auto;max-width:100%}
.draftbar-tabs button{background:transparent;border:1px solid transparent;color:#fff;padding:6px 12px;border-radius:999px;cursor:pointer;white-space:nowrap;font-weight:500}
.draftbar-tabs button:hover{border-color:#ffffff55}
.draftbar-tabs button[aria-current="page"]{background:var(--pt-mint);color:var(--ink);font-weight:700}
.draftbar-tabs button:focus-visible{outline-color:var(--pt-mint)}
.draftbar-note{color:#C9D2CD;margin-left:auto;font-size:13px}
.draftnote{background:var(--ink);color:#fff;border-radius:var(--r-sm);padding:12px 14px;font-size:14px;line-height:1.45}
.draftnote strong{color:var(--pt-mint)}

/* ---------- school page shell ---------- */
.shell{max-width:1040px;margin:0 auto;padding:28px 20px 80px;display:grid;grid-template-columns:1fr;gap:24px}
.rail{display:flex;flex-direction:column;gap:20px}
.school-id{display:flex;align-items:center;gap:14px}
.school-logo{width:56px;height:56px;flex:none;border-radius:16px;background:var(--school);color:var(--on-school);display:grid;place-items:center;font-weight:800;font-size:21px;letter-spacing:-0.02em;overflow:hidden}
.school-logo img{width:100%;height:100%;object-fit:contain;background:#fff}
.school-name{font-weight:800;font-size:20px;line-height:1.2;letter-spacing:-0.02em}
.school-sub{color:var(--muted);font-size:15px}
.steps{list-style:none;margin:0;padding:0;display:flex;gap:6px}
.steps li{flex:1}
.steps button{width:100%;background:none;border:0;padding:0;text-align:left;cursor:pointer;display:block}
.steps button:disabled{cursor:default}
.steps .bar{display:block;height:6px;border-radius:3px;background:var(--line)}
.steps .is-done .bar,.steps .is-current .bar{background:var(--school)}
.steps .num,.steps .lbl{display:none}
.step-now{font-size:15px;color:var(--muted)}
.step-now b{color:var(--ink)}
.rail-foot{display:none}

.sheet{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:26px 22px 28px;min-width:0}
main.sheet > * + *{margin-top:22px}
.sheet h1{font-size:30px;line-height:1.14;font-weight:800;letter-spacing:-0.03em}
.sheet h1:focus{outline:none}
.sheet h2{font-size:21px;line-height:1.25;font-weight:750}
main.sheet > h2{margin-top:38px}
.sheet h3{font-size:17px;font-weight:700}
.lede{font-size:19px;line-height:1.5;color:#1d2420}
.prose{max-width:64ch}
.prose > * + *{margin-top:14px}
.letter{max-width:60ch}
.letter > * + *{margin-top:14px}
.letter .signoff{margin-top:22px}
.letter .signoff b{display:block;font-size:19px}
.respond-by{display:inline-block;background:var(--mark);padding:2px 8px;border-radius:4px;font-weight:650}

.between{background:var(--school-tint);padding:18px 20px;border-radius:var(--r-sm);max-width:64ch}
.between h3{margin-bottom:6px}
.between p{font-size:16px}

.vid{margin:0;max-width:640px}
.vid video{display:block;width:100%;aspect-ratio:16/9;background:#101412;border-radius:var(--r-sm);object-fit:cover}
.vid figcaption{font-size:14.5px;color:var(--muted);margin-top:8px}
.vid-fallback{border:1px solid var(--line);border-radius:var(--r-sm);background:#EEF2EF;display:flex;align-items:center;gap:14px;padding:14px 16px;font-size:15px;line-height:1.4}
.vid-fallback .play{width:40px;height:40px;border-radius:50%;background:var(--school);flex:none;position:relative}
.vid-fallback .play::after{content:"";position:absolute;left:16px;top:12px;border-left:12px solid var(--on-school);border-top:8px solid transparent;border-bottom:8px solid transparent}
.vid-fallback b{display:block;font-size:16px}

.looks{display:grid;gap:26px;grid-template-columns:1fr}
.look-text > * + *{margin-top:4px}
.look{display:grid;gap:12px}
.look p{font-size:16px;color:#252c28;max-width:52ch}

.gets{list-style:none;margin:0;padding:0;border-top:1px solid var(--line);max-width:64ch}
.gets li{padding:14px 0;border-bottom:1px solid var(--line);display:grid;grid-template-columns:1fr;gap:2px}
.gets b{font-weight:700}
.gets span{color:#252c28;font-size:16px}

/* route diagram: where the video goes */
.route{list-style:none;margin:0;padding:0;max-width:66ch;counter-reset:stop}
.route li{position:relative;padding:0 0 26px 44px;counter-increment:stop}
.route li::before{content:counter(stop);position:absolute;left:0;top:0;width:28px;height:28px;border-radius:50%;background:var(--school);color:var(--on-school);font-weight:700;font-size:14px;display:grid;place-items:center;z-index:1}
.route li::after{content:"";position:absolute;left:13px;top:28px;bottom:0;width:2px;background:var(--school);opacity:.35}
.route li:last-child{padding-bottom:0}
.route li:last-child::after{display:none}
.route h3{line-height:28px}
.route p{font-size:16px;color:#252c28;margin-top:2px}
.kept{display:inline-block;margin-top:8px;font-size:14.5px;font-weight:650;padding:2px 9px;border-radius:4px;background:#EEF2EF}
.kept.is-time{background:var(--mark)}

.facts{display:grid;gap:18px 28px;grid-template-columns:1fr;max-width:74ch}
.facts h3{margin-bottom:3px}
.facts p{font-size:16px;color:#252c28}
.plainlist{margin:0;padding-left:20px;max-width:62ch}
.plainlist li{margin-top:6px;font-size:16px}

/* FAQ */
.faq{border-top:1px solid var(--line);max-width:68ch}
.faq details{border-bottom:1px solid var(--line)}
.faq summary{cursor:pointer;padding:15px 34px 15px 0;font-weight:650;list-style:none;position:relative}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"+";position:absolute;right:6px;top:12px;font-size:22px;font-weight:400;color:var(--muted)}
.faq details[open] summary::after{content:"\2212"}
.faq .ans{padding:0 0 18px;font-size:16px;color:#252c28}
.faq .ans > * + *{margin-top:10px}
.contact{border:1px solid var(--line);border-radius:var(--r-sm);padding:18px;max-width:64ch}
.contact > * + *{margin-top:8px}
.contact dl{margin:8px 0 0;display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:16px}
.contact dt{color:var(--muted)}
.contact dd{margin:0;overflow-wrap:anywhere}

/* nav buttons */
.nav{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-top:34px !important;padding-top:22px;border-top:1px solid var(--line)}
.btn{appearance:none;border:1.5px solid var(--ink);background:var(--surface);color:var(--ink);padding:12px 20px;border-radius:999px;font-weight:650;cursor:pointer;font-size:16px;line-height:1.2}
.btn:hover{background:#F0F3F0}
.btn-primary{background:var(--school);border-color:var(--school);color:var(--on-school)}
.btn-primary:hover{background:var(--school);filter:brightness(.93)}
.btn-quiet{border-color:transparent;text-decoration:underline;text-underline-offset:3px;padding-left:6px;padding-right:6px}
.btn-sm{padding:7px 13px;font-size:14px;white-space:nowrap}
.nav .spacer{flex:1}

/* form */
.form{max-width:66ch}
.form > * + *{margin-top:22px}
fieldset{border:0;margin:0;padding:0;min-width:0}
legend{padding:0;font-weight:750;font-size:19px;margin-bottom:10px;letter-spacing:-0.01em}
.choices{display:grid;gap:10px}

<div class="draftbar" role="navigation" aria-label="Draft views">
  <span class="draftbar-label">Playtag draft</span>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
/* =====================================================================
   StoryLine school consent page, draft
   One template, one settings object per school. In production the
   settings come from a record keyed by the school's link (for example
   /juniper-lane), and submit() posts the signed record to a backend that
   (1) stores it, (2) emails a copy to the school and the signer, and
   (3) updates the consent log. In this draft, both live in the browser.
   ===================================================================== */

var FORM_VERSION = 'Family and educator consent, draft v0.1 (2026-11)';
var PRIVACY_EMAIL = 'privacy@playtag.ai';
var VIDEO_BASE = 'https://playtag.ai/Assets/';

  play:     {title: 'Play preferences', src: VIDEO_BASE + 'play%20preference.mp4', cap: ''},
  social:   {title: 'Social interaction', src: VIDEO_BASE + 'interaction-h264.mp4', cap: ''},
  activity: {title: 'Indoor activity', src: VIDEO_BASE + 'physical-activity-h264.mp4', cap: ''}
};

/* States with a biometric statute that calls for a specific notice or written release.
   Wording below is draft and needs counsel review before any school uses it. */
var BIOMETRIC_STATES = {
  IL: {name: 'Illinois', law: 'Illinois Biometric Information Privacy Act (740 ILCS 14)'},
  TX: {name: 'Texas', law: 'Texas Capture or Use of Biometric Identifier Act (Bus. & Com. Code 503.001)'},
  WA: {name: 'Washington', law: 'Washington biometric identifier law (RCW 19.375)'}
};
var US_STATES = 'AL AK AZ AR CA CO CT DE DC FL GA HI ID IL IN IA KS KY LA ME MD MA MI MN MS MO MT NE NV NH NJ NM NY NC ND OH OK OR PA RI SC SD TN TX UT VT VA WA WV WI WY'.split(' ');

var DEFAULT_SCHOOL = {
  name: 'Juniper Lane Preschool',
  slug: 'juniper-lane',
  city: 'Tampa',
  state: 'FL',
  director: 'Maria Alvarez',
  directorTitle: 'Director',

  receive: {moments: false, reports: false, early: false},

  roster: [

    'Zoe Bennett, Ladybugs', 'Ethan Park, Ladybugs', 'Lucia Moreno, Ladybugs', 'Owen Baker, Ladybugs',
    'Emma Nguyen, Caterpillars', 'Lucas Rivera, Caterpillars', 'Isla Cohen, Caterpillars', 'Mateo Garcia, Caterpillars',
    'Aria Patel, Caterpillars', 'Henry Walsh, Caterpillars', 'Nora Haddad, Caterpillars', 'Caleb Brooks, Caterpillars',
    'Sofia Martinez, Fireflies', 'Jack Sullivan, Fireflies', 'Chloe Tanaka, Fireflies', 'Elijah Carter, Fireflies',
    'Maya Friedman, Fireflies', 'Leo Santos, Fireflies', 'Ruby Jensen, Fireflies', 'Theo Abbott, Fireflies'
  ].join('\n'),
  teachers: [
    'Renee Carter, Ladybugs', 'Dani Whitlock, Ladybugs',
    'Priya Shah, Caterpillars', 'Marcus Lee, Caterpillars',
    'Elena Ruiz, Fireflies', 'Tom Becker, Fireflies'
  ].join('\n')
};

/* ---------- small helpers ---------- */
function $(s, r){ return (r || document).querySelector(s); }
function $all(s, r){ return Array.prototype.slice.call((r || document).querySelectorAll(s)); }
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
var store = {
  get: function(k, d){ try { var v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch(e){ return d; } },
  set: function(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }
};
function clone(o){ return JSON.parse(JSON.stringify(o)); }
function fmtDate(iso, long){
  if(!iso) return '';
  var d = new Date(iso.length <= 10 ? iso + 'T12:00:00' : iso);
  if(isNaN(d)) return iso;
  return d.toLocaleDateString('en-US', long ? {weekday:'long', month:'long', day:'numeric'} : {month:'short', day:'numeric', year:'numeric'});
}
function fmtDateTime(iso){
  var d = new Date(iso); if(isNaN(d)) return iso;
  return d.toLocaleDateString('en-US', {month:'long', day:'numeric', year:'numeric'}) + ' at ' + d.toLocaleTimeString('en-US', {hour:'numeric', minute:'2-digit'});
}
function initials(name){
  var w = String(name).replace(/[^A-Za-z0-9 ]/g, '').split(/\s+/).filter(Boolean);
  return ((w[0] || 'S')[0] + (w[1] ? w[1][0] : '')).toUpperCase();
}
function parseList(text){
  return String(text || '').split('\n').map(function(l){ return l.trim(); }).filter(Boolean).map(function(l){
    var i = l.lastIndexOf(',');
    return i < 0 ? {name: l, classroom: 'Unassigned'} : {name: l.slice(0, i).trim(), classroom: l.slice(i + 1).trim() || 'Unassigned'};
  });
}
function classrooms(){
  var seen = [], out = [];
  parseList(S.roster).concat(parseList(S.teachers)).forEach(function(r){ if(seen.indexOf(r.classroom) < 0){ seen.push(r.classroom); out.push(r.classroom); } });
  return out;
}
function norm(s){ return String(s || '').toLowerCase().replace(/\s+/g, ' ').trim(); }
function copyText(text, statusEl, okMsg){
  function done(ok){ if(statusEl){ statusEl.textContent = ok ? okMsg : 'Copy was blocked. Select the text and copy it by hand.'; } }
  try { navigator.clipboard.writeText(text).then(function(){ done(true); }, function(){ done(false); }); }
  catch(e){ done(false); }

S.receive = Object.assign(clone(DEFAULT_SCHOOL.receive), S.receive || {});
var responses = store.get('slc-responses', []);       // forms submitted in this browser
var verified = store.get('slc-verified', {});          // school check, by reference
var VIEWS = ['family', 'teacher', 'consent-log', 'school-setup'];
var view = 'family';
var step = {family: 0, teacher: 0};
var reached = {family: 0, teacher: 0};

var forms = {family: blankForm(), teacher: blankForm()};

function applyTheme(){
  var hex = /^#[0-9a-f]{6}$/i.test(S.accent) ? S.accent : DEFAULT_SCHOOL.accent;
  var r = parseInt(hex.slice(1, 3), 16), g = parseInt(hex.slice(3, 5), 16), b = parseInt(hex.slice(5, 7), 16);
  var lum = (0.2126 * r + 0.7152 * g + 0.0722 * b) / 255;
  function tint(c){ return Math.round(c + (255 - c) * 0.91); }
  var st = document.documentElement.style;
  st.setProperty('--school', hex);
  st.setProperty('--on-school', lum > 0.6 ? '#0A0A0A' : '#FFFFFF');
  st.setProperty('--school-tint', 'rgb(' + tint(r) + ',' + tint(g) + ',' + tint(b) + ')');

/* ---------- shared fragments ---------- */
function video(key, caption){
  var v = VIDEOS[key];
  return '<figure class="vid"><video controls playsinline muted preload="metadata" src="' + v.src + '"></video>' +
    '<div class="vid-fallback" hidden><span class="play" aria-hidden="true"></span><span><b>Video: ' + esc(v.title) + '</b>It plays here on the live page. <a href="' + v.src + '">Open the clip on playtag.ai</a></span></div>' +

  return '<div class="school-logo" aria-hidden="true">' + (S.logo ? '<img src="' + esc(S.logo) + '" alt="">' : esc(initials(S.name))) + '</div>';

function contactCard(title){
  return '<div class="contact"><h3>' + esc(title) + '</h3>' +
    '<p>' + esc(S.director) + ', ' + esc(S.directorTitle) + ', is glad to talk it through with you.</p>' +
    '<dl><dt>Email</dt><dd><a href="mailto:' + esc(S.email) + '">' + esc(S.email) + '</a></dd>' +
    '<dt>Phone</dt><dd>' + esc(S.phone) + '</dd>' +

}

  return '<div class="faq">' + items.map(function(it){

  return '<div class="between"><h3>Who this agreement is between</h3><p>This ' + (aud === 'family' ? 'permission' : 'consent') +

   FAMILY CONTENT
   ===================================================================== */
var STEPS = {
  family: ['Welcome', 'What StoryLine does', 'Your child’s privacy', 'Questions families ask', 'Consent form'],
  teacher: ['Welcome', 'What it does for you', 'Your privacy', 'Questions teachers ask', 'Consent form']
};

function famWelcome(){
  return '<div class="letter"><h1 tabindex="-1">Dear ' + esc(S.name) + ' families,</h1>' +
    '<p class="lede">Starting the week of ' + esc(fmtDate(S.startDate, true).replace(/^\w+, /, '')) + ', our classrooms will use StoryLine. It helps our teachers notice more about how each child plays, moves and makes friends.</p>' +
    '<p>Our teachers already watch your child closely every day. StoryLine gives them more to work with, and more to draw on when they talk with you about your child.</p>' +
    '<p>Your child takes part only if you say yes. This page explains what StoryLine is, how your child’s privacy is protected, and the questions families ask most. At the end you can give or decline permission. It takes about five minutes.</p>' +
    '<p>Whatever you decide, your child’s place and care at ' + esc(S.name) + ' stay exactly the same.</p>' +

      }).join('') + '</div>' + fieldErr('acks') + '</fieldset>';

    h += '<div><button type="submit" class="btn btn-primary">' + esc(label) + '</button></div>' +

  }
  h += '</form>';
  return h;

    });
    if(!f.gName.trim()) e.gname = 'Enter your full name.';

    var emailOk = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(f.email.trim());
    if(f.decision === 'yes' && !emailOk) e.email = 'Enter an email address so we can send you a copy.';
    if(f.decision === 'questions' && !emailOk && !f.phone.trim()) e.email = 'Enter an email or a phone number so we can reach you.';

function recordFields(r){

function recordEmail(r){

  if((r.ackText || []).length) out.push('Statements confirmed:\n' + r.ackText.map(function(t, i){ return (i + 1) + '. ' + t; }).join('\n'));

function pdfText(t){ return String(t == null ? '' : t).replace(/[\u2018\u2019]/g, "'").replace(/[\u201C\u201D]/g, '"').replace(/\u2212/g, '-').replace(/\u00A0/g, ' '); }
function buildPdf(r){

  var school = r.schoolName || S.name;

function saveFile(blob, filename, statusEl){
  function say(m, bad){ if(statusEl){ statusEl.textContent = m; statusEl.style.color = bad ? 'var(--err)' : ''; } }

    say('Preparing ' + filename);

      return d.save({filename: filename, data: blob}).then(function(){ say('Saved ' + filename + '.'); });
    }).catch(function(err){ say(err && err.code === 'declined' ? 'Download cancelled.' : 'The PDF could not be saved in this view.', true); });
    return;

    setTimeout(function(){ URL.revokeObjectURL(url); }, 5000);
    say('Saved ' + filename + ' to your downloads.');

}
function downloadRecord(ref, statusEl){

function buildLog(aud){
  var roster = parseList(aud === 'family' ? S.roster : S.teachers);
  var first = ['Jordan', 'Sam', 'Alex', 'Morgan', 'Casey', 'Riley'];
  var rows = roster.map(function(p, i){
    var row = {name: p.name, classroom: p.classroom, decision: null, signer: '', research: null, at: '', ref: '', sample: false, onRoster: true};
    if(S.sample){
      var k = i % 8, d;
      if(aud === 'family'){ d = (k === 3 || k === 7) ? null : (i % 16 === 6 ? 'no' : 'yes'); if(i === 10) d = 'questions'; }
      else { d = i === roster.length - 1 ? null : 'yes'; }
      if(d){
        var surname = p.name.split(' ').slice(-1)[0];
        row.decision = d; row.sample = true;
        row.signer = aud === 'family' ? first[i % 6] + ' ' + surname : p.name;
        row.research = aud === 'family' && d === 'yes' ? i % 2 === 0 : null;
        row.at = '2026-11-' + String(9 + (i * 5) % 7).padStart(2, '0') + 'T' + String(8 + (i * 3) % 11).padStart(2, '0') + ':' + String((i * 17) % 60).padStart(2, '0') + ':00';
        row.ref = initials(S.name) + '-2611' + String(9 + (i * 5) % 7).padStart(2, '0') + '-S' + String(100 + i);
        if(d === 'yes' && i % 3 !== 0 && verified[row.ref] === undefined) row.defaultVerified = true;
      }
    }
    return row;
  });
  responses.filter(function(r){ return r.audience === aud && r.school === S.slug; }).forEach(function(r){
    r.people.forEach(function(p){
      var hit = rows.filter(function(row){ return norm(row.name) === norm(p.name); })[0];
      var data = {decision: r.decision, signer: r.signer.name, research: r.decision === 'yes' && aud === 'family' ? r.research : null, at: r.submittedAt, ref: r.ref, sample: false, defaultVerified: false, classroom: p.classroom};
      if(hit) Object.assign(hit, data);

}

    var a = count(rr, 'yes'), b = count(rr, 'no'), c = count(rr, 'questions'), d = count(rr, null), t = rr.length;
    function seg(v, cls){ return v ? '<i class="' + cls + '" style="width:' + (v / t * 100) + '%"></i>' : ''; }
    return '<div><div class="classbar-top"><b>' + esc(room) + '</b><span>' + a + ' of ' + t + ' consented' + (d ? ', ' + d + ' waiting' : '') + '</span></div>' +
      '<div class="stack" role="img" aria-label="' + esc(room) + ': ' + a + ' consented, ' + b + ' declined, ' + c + ' with questions, ' + d + ' no response">' + seg(a, 's-yes') + seg(b, 's-no') + seg(c, 's-q') + seg(d, 's-wait') + '</div></div>';
  }).join('');
  var shown = rows.filter(function(r){ return logFilter === 'all' || (logFilter === 'none' ? !r.decision : r.decision === logFilter); });
  var famCols = logTab === 'family';
  var table = '<div class="tablewrap"><table><thead><tr><th>' + (famCols ? 'Child' : 'Educator') + '</th><th>Classroom</th><th>Decision</th>' + (famCols ? '<th>Parent or guardian</th><th>Research</th>' : '') + '<th>Received</th><th>School check</th><th>Reference</th></tr></thead><tbody>' +
    (shown.length ? shown.map(function(r){
      return '<tr><td><b>' + esc(r.name) + '</b>' + (r.onRoster === false ? '<br><span class="tag">Not on roster, check name</span>' : '') + (r.ref && !r.sample ? '<br><span class="tag" style="color:var(--pt-teal)">Entered in this browser</span>' : '') + '</td>' +
        '<td>' + esc(r.classroom) + '</td><td>' + pill(r.decision) + '</td>' +
        (famCols ? '<td>' + esc(r.signer) + '</td><td>' + (r.research === null ? '' : r.research ? 'Yes' : 'No') + '</td>' : '') +
        '<td class="num">' + (r.at ? esc(fmtDate(r.at)) : '') + '</td>' +
        '<td>' + (r.decision === 'yes' || r.decision === 'no' ? '<button type="button" class="btn btn-sm" data-act="verify" data-ref="' + esc(r.ref) + '" data-on="' + (isVerified(r) ? '1' : '0') + '" aria-pressed="' + isVerified(r) + '">' + (isVerified(r) ? '✓ Checked' : 'Mark as checked') + '</button>' : '') + '</td>' +
        '<td class="num">' + esc(r.ref) + (r.ref && !r.sample ? '<br><button type="button" class="btn btn-sm" style="margin-top:6px" data-act="pdf" data-ref="' + esc(r.ref) + '">PDF record</button>' : '') + '</td></tr>';
    }).join('') : '<tr><td colspan="8">No entries match this filter.</td></tr>') + '</tbody></table></div>';
  return '<div class="staff"><div><h1>Consent log: ' + esc(S.name) + '</h1>' +
    '<p class="sub">What the director and Playtag both see. Each submitted form adds a row, and the school confirms every signer against its enrollment records before StoryLine starts on ' + esc(fmtDate(S.startDate)) + '.' + (S.sample ? ' Rows shown here are sample data, plus anything you submit from the Family or Teacher page.' : '') + '</p></div>' +
    '<div class="tiles">' +
      '<div class="tile t-yes"><div class="n">' + y + ' <small>of ' + fam.length + '</small></div><div class="l">children with consent</div></div>' +
      '<div class="tile t-no"><div class="n">' + n + '</div><div class="l">declined</div></div>' +
      '<div class="tile t-q"><div class="n">' + q + '</div><div class="l">' + (q === 1 ? 'family wants' : 'families want') + ' to talk first</div></div>' +
      '<div class="tile t-wait"><div class="n">' + w + '</div><div class="l">no response yet</div></div>' +
    '</div>' +
    '<div class="panel"><div class="ready' + (ready ? ' is-ok' : '') + '"><span class="dot"></span><div><b>' + (ready ? 'Consent records are complete.' : 'Not ready to start yet.') + '</b> ' +
      'Educators: ' + ty + ' of ' + tch.length + ' consented' + (tw ? ', ' + tw + ' waiting' : '') + '. Families: ' + (fam.length - w) + ' of ' + fam.length + ' have responded. Service cannot begin until consent documentation is complete.</div></div></div>' +
    '<div class="panel"><h2>Families by classroom</h2><div class="classbars">' + bars + '</div>' +
      '<div class="legend"><span><i class="s-yes"></i>Consented</span><span><i class="s-no"></i>Declined</span><span><i class="s-q"></i>Has questions</span><span><i class="s-wait"></i>No response</span></div></div>' +
    '<div class="panel"><div class="toolbar"><div class="seg" role="group" aria-label="Who"><button type="button" data-logtab="family" aria-pressed="' + (logTab === 'family') + '">Families</button><button type="button" data-logtab="teacher" aria-pressed="' + (logTab === 'teacher') + '">Educators</button></div>' +
      '<label for="logfilter" class="fine">Show</label><select id="logfilter"><option value="all">Everyone</option><option value="yes">Consented</option><option value="no">Declined</option><option value="questions">Has questions</option><option value="none">No response</option></select>' +
      '<span style="flex:1"></span><button type="button" class="btn btn-sm" data-act="copy-csv">Copy as CSV</button><button type="button" class="btn btn-sm" data-act="copy-reminder">Copy reminder message</button></div>' +
      '<p class="status" id="log-status" role="status"></p>' + table + '</div></div>';
}
function reminderText(){
  return 'Dear families,\n\nA quick reminder to please respond to the StoryLine consent form by ' + fmtDate(S.deadline, true) + '. The page takes about five minutes, explains how your child’s privacy is protected, and lets you say yes or no.\n\n' + familyLink() + '\n\nIf you have questions, reply to this email or call me at ' + S.phone + '. Whatever you decide, your child’s place and care here stay the same.\n\nThank you,\n' + S.director + '\n' + S.directorTitle + ', ' + S.name;
}

/* =====================================================================
   SCHOOL SETUP
   ===================================================================== */
function familyLink(){ return 'https://consent.mystoryline.ai/' + (S.slug || 'school'); }
function launchEmail(){
  return 'Subject: Your permission needed: StoryLine at ' + S.name + '\n\nDear families,\n\nStarting the week of ' + fmtDate(S.startDate, true).replace(/^\w+, /, '') + ', ' + S.name + ' will use StoryLine in our classrooms. StoryLine helps our teachers understand each child’s play preferences, friendships and activity through the day, so we can personalize support for each child.\n\nYour child takes part only if you say yes. We have put everything on one page: what StoryLine is, short videos, how your child’s privacy is protected, answers to common questions, and the permission form itself. It takes about five minutes.\n\n' + familyLink() + '\n\nPlease respond by ' + fmtDate(S.deadline, true) + '. If you would like to talk first, reply to this email or call ' + S.phone + '. Paper forms are available at the front desk.\n\nWhatever you decide, your child’s place and care at ' + S.name + ' stay exactly the same.\n\nWarm regards,\n' + S.director + '\n' + S.directorTitle + ', ' + S.name;
}
function setupField(id, label, key, type, extra){
  return '<div class="field"><label for="' + id + '">' + label + '</label><input id="' + id + '" type="' + (type || 'text') + '" data-set="' + key + '" value="' + esc(S[key]) + '"' + (extra || '') + '></div>';
}
function renderSetup(){
  var swatches = ['#3A4FA3', '#B23A48', '#1E6F5C', '#C76B00', '#6B3FA0', '#00779E', '#2D2D2D'];
  var exportObj = clone(S); if(exportObj.logo) exportObj.logo = '(uploaded image)';
  return '<div class="staff"><div><h1>School setup</h1><p class="sub">One record per school drives the whole page: the name, the director’s letter, the colors, the classrooms, the state notice and the roster the log is checked against. Change anything here, then open the Family or Teacher page to see it.</p></div>' +
  '<div class="setup-grid"><div class="panel"><h2>School</h2><div class="setup-fields two">' +
    setupField('s-name', 'School name', 'name') + setupField('s-slug', 'Link name', 'slug') +
    setupField('s-director', 'Director or owner', 'director') + setupField('s-title', 'Title', 'directorTitle') +
    setupField('s-email', 'Signed forms go to', 'email', 'email') + setupField('s-phone', 'Phone', 'phone', 'tel') +
    setupField('s-city', 'City', 'city') +
    '<div class="field"><label for="s-state">State</label><select id="s-state" data-set="state">' + US_STATES.map(function(s){ return '<option' + (s === S.state ? ' selected' : '') + '>' + s + '</option>'; }).join('') + '</select></div>' +
    '</div><p class="fine">' + (BIOMETRIC_STATES[S.state] ? 'This state adds a biometric notice and written release above the permission box.' : 'Choose IL, TX or WA to see the state biometric notice added to the family form.') + '</p>' +
    '<h2>Look</h2><div class="field"><span class="lab">School color</span><div class="swatches">' + swatches.map(function(c){ return '<button type="button" data-swatch="' + c + '" style="background:' + c + '" aria-label="Use color ' + c + '"></button>'; }).join('') + '<input type="color" id="s-accent" data-set="accent" value="' + esc(S.accent) + '" aria-label="Custom color"></div></div>' +
    '<div class="field"><label for="s-logo">Logo <span class="opt">(PNG, JPG or SVG, under 300 KB)</span></label><input id="s-logo" type="file" accept="image/*">' + (S.logo ? '<div style="margin-top:8px"><button type="button" class="btn btn-sm" data-act="clear-logo">Remove logo</button></div>' : '') + '<p class="status" id="logo-status" role="status"></p></div>' +
    '<h2>Program</h2><div class="setup-fields two">' +
    '<div class="field"><label for="s-cams">Cameras</label><select id="s-cams" data-set="cameras"><option value="new"' + (S.cameras === 'new' ? ' selected' : '') + '>New cameras will be installed</option><option value="existing"' + (S.cameras === 'existing' ? ' selected' : '') + '>School already has cameras</option></select></div>' +
    setupField('s-deadline', 'Respond by', 'deadline', 'date') + setupField('s-start', 'StoryLine starts the week of', 'startDate', 'date') +
    '</div>' +
    '<div class="field"><span class="lab">Tell families what they will receive <span class="opt">(the school chooses; leave all blank to hide the section)</span></span></div>' +
    '<label class="checkline"><input type="checkbox" data-set="receive.moments"' + (S.receive.moments ? ' checked' : '') + '><span>Moments from the day: teacher-approved photos and short clips</span></label>' +
    '<label class="checkline"><input type="checkbox" data-set="receive.reports"' + (S.receive.reports ? ' checked' : '') + '><span>Developmental reports</span></label>' +
    (S.receive.reports ? '<div class="setup-fields two">' + setupField('s-cadence', 'Reports are sent', 'reportCadence') + '</div>' : '') +
    '<label class="checkline"><input type="checkbox" data-set="receive.early"' + (S.receive.early ? ' checked' : '') + '><span>Earlier conversations with teachers when a pattern changes</span></label>' +
    '<h2>Options</h2>' +
    '<label class="checkline"><input type="checkbox" data-set="research"' + (S.research ? ' checked' : '') + '><span>Offer the optional research and improvement box to families</span></label>' +
    '<label class="checkline"><input type="checkbox" data-set="sample"' + (S.sample ? ' checked' : '') + '><span>Show sample responses in the consent log</span></label>' +
    '<h2>Rosters</h2><div class="field"><label for="s-roster">Children <span class="opt">(one per line: name, classroom)</span></label><textarea id="s-roster" class="copyout" data-set="roster" style="min-height:180px">' + esc(S.roster) + '</textarea></div>' +
    '<div class="field"><label for="s-teachers">Educators <span class="opt">(one per line: name, classroom)</span></label><textarea id="s-teachers" class="copyout" data-set="teachers" style="min-height:110px">' + esc(S.teachers) + '</textarea></div>' +
    '<div><button type="button" class="btn btn-sm" data-act="reset-school">Reset to the sample school</button> <button type="button" class="btn btn-sm" data-act="clear-responses">Clear forms entered in this browser</button></div>' +
  '</div>' +
  '<div style="display:grid;gap:20px;align-content:start">' +
    '<div class="panel"><h2>Links for this school</h2><p class="fine">Example addresses. The live page reads the school from the link.</p>' +
      '<div><div class="fine">Families</div><div class="linkline" id="link-family">' + esc(familyLink()) + '</div></div>' +
      '<div><div class="fine">Educators</div><div class="linkline" id="link-teacher">' + esc(familyLink()) + '/staff</div></div></div>' +
    '<div class="panel"><h2>Message for ' + esc(S.director) + ' to send families</h2><textarea class="copyout" id="launch-email" readonly style="min-height:260px">' + esc(launchEmail()) + '</textarea>' +
      '<div class="toolbar"><button type="button" class="btn btn-sm" data-act="copy-email">Copy message</button><span class="status" id="email-status" role="status"></span></div></div>' +
    '<div class="panel"><h2>What the live version does with each form</h2><ol class="howlist">' +
      '<li>Saves the signed record with its reference, time, form version and the exact statements ticked.</li>' +
      '<li>Emails a PDF record of consent to the signer and to ' + esc(S.email) + '.</li>' +
      '<li>Adds a row to this school’s consent log, which the director and Playtag onboarding can both open.</li>' +
      '<li>Waits for the school to mark each signer as checked against enrollment before StoryLine includes that child.</li></ol></div>' +
    '<div class="panel"><h2>This school’s record</h2><textarea class="copyout" id="school-json" readonly style="min-height:160px">' + esc(JSON.stringify(exportObj, null, 2)) + '</textarea>' +
      '<div class="toolbar"><button type="button" class="btn btn-sm" data-act="copy-json">Copy record</button><span class="status" id="json-status" role="status"></span></div></div>' +
  '</div></div></div>';
}

/* =====================================================================
   RENDER + EVENTS
   ===================================================================== */
var app = $('#app');
function render(focus){
  applyTheme();
  $all('#tabs button').forEach(function(b){ if(b.dataset.view === view) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current'); });
  if(view === 'family' || view === 'teacher'){
    app.innerHTML = renderPage(view);
    $all('video', app).forEach(function(v){
      v.addEventListener('error', function(){ v.hidden = true; var fb = v.parentNode.querySelector('.vid-fallback'); if(fb) fb.hidden = false; });
    });
    initSig(view);
  } else if(view === 'consent-log'){
    app.innerHTML = renderLog();
    var lf = $('#logfilter'); if(lf) lf.value = logFilter;
  } else {
    app.innerHTML = renderSetup();
  }
  if(focus === 'top'){
    window.scrollTo(0, 0);
    var h = $('h1', app); if(h){ try { h.focus({preventScroll: true}); } catch(e){} }
  } else if(focus === 'errors'){
    var es = $('#errsum'); if(es){ es.scrollIntoView({block: 'start'}); es.focus({preventScroll: true}); }
  }
}
function go(v){ if(VIEWS.indexOf(v) < 0) v = 'family'; view = v; errors = {}; try { if(location.hash !== '#' + v) location.hash = v; } catch(e){} render('top'); }
function setPath(obj, path, val){
  var parts = path.split('.'), o = obj;
  for(var i = 0; i < parts.length - 1; i++) o = o[parts[i]];
  o[parts[parts.length - 1]] = val;
}

$('#tabs').addEventListener('click', function(ev){ var b = ev.target.closest('button[data-view]'); if(b) go(b.dataset.view); });
window.addEventListener('hashchange', function(){ var v = location.hash.slice(1); if(VIEWS.indexOf(v) >= 0 && v !== view){ view = v; errors = {}; render('top'); } });

function clearErr(t){
  if(!t || !t.closest) return;
  if(t.getAttribute('aria-invalid')){ t.removeAttribute('aria-invalid'); var m = t.parentNode.querySelector('.msg-err'); if(m) m.hidden = true; }
  var box = t.closest('.is-missing'); if(box && t.type === 'checkbox' && t.checked) box.classList.remove('is-missing');
}
app.addEventListener('input', function(ev){
  var t = ev.target;
  clearErr(t);
  if(t.dataset.bind && (view === 'family' || view === 'teacher') && t.type !== 'radio' && t.type !== 'checkbox'){ setPath(forms[view], t.dataset.bind, t.value); }
  if(t.dataset.set && t.type !== 'checkbox' && t.tagName !== 'SELECT' && t.type !== 'date'){
    S[t.dataset.set] = t.dataset.set === 'slug' ? t.value.toLowerCase().replace(/[^a-z0-9-]+/g, '-') : t.value;
    store.set('slc-school', S); applyTheme();
    var le = $('#launch-email'); if(le) le.value = launchEmail();
    var lf = $('#link-family'); if(lf) lf.textContent = familyLink();
    var lt = $('#link-teacher'); if(lt) lt.textContent = familyLink() + '/staff';
  }
});
app.addEventListener('change', function(ev){
  var t = ev.target;
  clearErr(t);
  if(t.dataset.bind && (view === 'family' || view === 'teacher')){
    var f = forms[view];
    if(t.type === 'checkbox') setPath(f, t.dataset.bind, t.checked);
    else setPath(f, t.dataset.bind, t.value);
    if(t.hasAttribute('data-rerender')){ errors = {}; render(); var d = $('#decision'); if(d){ var c = $('input:checked', d); if(c) c.focus({preventScroll: true}); } }
    return;
  }
  if(t.dataset.set){
    var structural = t.type === 'checkbox' || t.tagName === 'SELECT' || t.type === 'date';
    if(structural){ setPath(S, t.dataset.set, t.type === 'checkbox' ? t.checked : t.value); store.set('slc-school', S); render(); }
    return;
  }
  if(t.id === 'logfilter'){ logFilter = t.value; render(); return; }
  if(t.id === 's-logo' && t.files && t.files[0]){
    var file = t.files[0], st = $('#logo-status');
    if(file.size > 300 * 1024){ st.style.color = 'var(--err)'; st.textContent = 'That file is ' + Math.round(file.size / 1024) + ' KB. Choose one under 300 KB.'; return; }
    var rd = new FileReader();
    rd.onload = function(){ S.logo = rd.result; store.set('slc-school', S); render(); };
    rd.readAsDataURL(file);
  }
});
app.addEventListener('submit', function(ev){
  ev.preventDefault();
  if(ev.target.id !== 'consent-form') return;
  errors = validate(view);
  if(Object.keys(errors).length){ render('errors'); return; }
  submit(view); render('top');
});
app.addEventListener('click', function(ev){
  var j = ev.target.closest('[data-jump]');
  if(j){ ev.preventDefault(); var id = j.dataset.jump, el = document.getElementById(id) || (id === 'acks' ? $('#acks input:not(:checked)') : null); if(el){ el.scrollIntoView({block: 'center'}); try { (el.matches('input,select,textarea,canvas') ? el : $('input,select,textarea', el) || el).focus({preventScroll: true}); } catch(e){} } return; }
  var sb = ev.target.closest('button[data-step]');
  if(sb && !sb.disabled){ step[view] = +sb.dataset.step; errors = {}; render('top'); return; }
  var lt = ev.target.closest('button[data-logtab]');
  if(lt){ logTab = lt.dataset.logtab; render(); return; }
  var sw = ev.target.closest('button[data-swatch]');
  if(sw){ S.accent = sw.dataset.swatch; store.set('slc-school', S); render(); return; }
  var b = ev.target.closest('[data-act]'); if(!b) return;
  var act = b.dataset.act, aud = view, f = forms[aud];
  if(act === 'next'){ step[aud] = Math.min(4, step[aud] + 1); reached[aud] = Math.max(reached[aud], step[aud]); render('top'); }
  else if(act === 'back'){ step[aud] = Math.max(0, step[aud] - 1); errors = {}; render('top'); }
  else if(act === 'ask-first'){ f.decision = 'questions'; step[aud] = 4; reached[aud] = 4; render('top'); }
  else if(act === 'add-child'){ f.children.push({name: '', classroom: ''}); render(); var nc = $('#child-' + (f.children.length - 1)); if(nc) nc.focus(); }
  else if(act === 'remove-child'){ f.children.splice(+b.dataset.i, 1); errors = {}; render(); }
  else if(act === 'clear-sig'){ f.sigData = ''; var c = $('#sigpad'); if(c){ c.getContext('2d').clearRect(0, 0, c.width, c.height); } }
  else if(act === 'another'){ done[aud] = null; step[aud] = 4; reached[aud] = 4; render('top'); }
  else if(act === 'verify'){ verified[b.dataset.ref] = b.dataset.on !== '1'; store.set('slc-verified', verified); render(); }
  else if(act === 'copy-csv'){ var rows = buildLog(logTab); copyText(toCsv(rows, logTab), $('#log-status'), 'Copied ' + rows.length + ' rows. Paste into a spreadsheet.'); }
  else if(act === 'copy-reminder'){ copyText(reminderText(), $('#log-status'), 'Reminder message copied.'); }
  else if(act === 'pdf'){ downloadRecord(b.dataset.ref, $('#pdf-status') || $('#log-status')); }
  else if(act === 'copy-rec'){ copyText($('#rec-email').value, $('#rec-status'), 'Email copied.'); }
  else if(act === 'copy-email'){ copyText(launchEmail(), $('#email-status'), 'Message copied.'); }
  else if(act === 'copy-json'){ copyText($('#school-json').value, $('#json-status'), 'Record copied.'); }
  else if(act === 'clear-logo'){ S.logo = ''; store.set('slc-school', S); render(); }
  else if(act === 'reset-school'){ S = clone(DEFAULT_SCHOOL); store.set('slc-school', S); render(); }
  else if(act === 'clear-responses'){ responses = []; verified = {}; store.set('slc-responses', responses); store.set('slc-verified', verified); done = {family: null, teacher: null}; render(); }
});

(function start(){
  var v = ''; try { v = location.hash.slice(1); } catch(e){}
  if(VIEWS.indexOf(v) >= 0) view = v;
  render();
})();
</script>
</body>
</html>
